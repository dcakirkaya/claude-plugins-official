name: Sync marketplace

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-marketplace
  cancel-in-progress: false

jobs:
  sync:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate marketplace
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/sync_marketplace.py --fail-on-skip

      - name: Test and validate
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_marketplace.py --copilot-if-available

      - name: Publish marketplace update
        run: |
          if git diff --quiet -- .github/plugin/marketplace.json .github/plugin/upstream.json; then
            echo "Marketplace is already current."
            exit 0
          fi

          revision="$(python -c 'import json; print(json.load(open(".github/plugin/upstream.json"))["upstream_revision"])')"
          short_revision="${revision:0:12}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/plugin/marketplace.json .github/plugin/upstream.json
          git commit -m "Sync Anthropic marketplace at ${short_revision}"
          git push origin HEAD:main

  notify-failure:
    needs: sync
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update failure alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Marketplace sync failed"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "\"$title\" in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" \
            | head -1)"

          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body "Another marketplace sync failed: ${run_url}"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --assignee "$GITHUB_REPOSITORY_OWNER" \
              --title "$title" \
              --body "The automatic marketplace sync failed. Review the workflow run: ${run_url}"
          fi
